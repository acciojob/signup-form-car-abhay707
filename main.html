<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<label for="name">Name</label>
	<input id="name" required type="text" placeholder="Name"/>
	<br>
	
	<label for="email">Email</label>
	<input id="email" required type="text" placeholder="Email"/>
	<br>
	
	
	<input id="gender_m" required type="radio" name="gender"/>
	<label for="gender_m">Male</label>
	<input id="gender_f" required type="radio" name="gender"/>
	<label for="gender_f">female</label>
	<br>
		
	<label for="cars">Car Brand</label>
	<select id="cars" required type="select" placeholder="--Please choose an option--">
		<option>BMW</option>
		<option>Audi</option>
		<option>Mercedice</option>
	</select>
	<br>

	<label for="age">Age</label>
	<input id="age" required type="number" placeholder="Age"/>
	<br>	

	<label for="dob">DOB</label>
	<input id="dob" required type="Date"/>
	<br>

	<label for="tel">Phone Number</label>
	<input id="tel" type="Tel" placeholder="xxx-xxx-xxxx"/>
	<br>

	<label for="password">Password</label>
	<input id="password" required type="password" placeholder="Password"/>
	<br>

	<label for="tos">I agree to the TOS</label>
	<input id="tos" required type="checkbox" value="I agree to the TOS"/>
	<br>

	<button type="submit">submit</button>
	
	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
